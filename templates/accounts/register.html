{% extends 'base.html' %}

{% block title %}
  Register
{% endblock %}

{% block content %}
  <form method="post" action="{% url 'user:register' %}">
    {% csrf_token %}
    {% if token %}
      <input type="hidden" name="token" value="{{ token }}">
    {% endif %}

    <label for="name">
      Name:
    </label>
    <input
      name="name"
      type="text"
      id="name"
      placeholder="Enter your full name"
      autofocus
      required
    >

    <label for="email">
      Email:
    </label>
    <input
      name="email"
      type="email"
      id="email"
      placeholder="Enter your email address"
      required
    >

    <label for="password">
      Password:
    </label>
    <input
      name="password"
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >

    <label for="complete_password">
      Confirm Password:
    </label>
    <input
      name="complete_password"
      type="password"
      id="complete_password"
      placeholder="Confirm your password"
      required
    >

    <input type="submit" value="Register">
  </form>
{% endblock %}
