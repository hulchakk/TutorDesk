{% extends 'base.html' %}

{% block title %}
	App - login
{% endblock %}

{% block content %}
  <form method="post" action="{% url 'user:login' %}">
    {% csrf_token %}
    {% if token %}
      <input type="hidden" name="token" value="{{ token }}">
    {% endif %}
    <label for="username">
      Email:
    </label>
    <input
      name="username"
      type="text"
      id="username"
      placeholder="Enter your email address"
      autofocus
      required
    >
    <label for="password">
      Password:
    </label>
    <input
      name="password"
      type="password"
      id="password"
      placeholder="Enter your password"
      required
    >
    <input type="submit" value="Login">
  </form>
{% endblock %}
