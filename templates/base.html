{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>{% block title %}{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">

  <script src="https://unpkg.com/htmx.org@2.0.0"></script>
  <script src="{% static 'js/app.js' %}" defer></script>
  {% block head %}
  {% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block topbar %}
  {% include 'includes/topbar.html' %}
  {% endblock %}

  {% if messages %}
  <div class="toasts" role="status">
    {% for message in messages %}
      <div class="toast toast--{{ message.tags }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="page {% block page_class %}{% endblock %}">
    {% block content %}
    {% endblock %}
  </main>
</body>
</html>
