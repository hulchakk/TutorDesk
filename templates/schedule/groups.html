{% extends 'base.html' %}

{% block title %}
	My - groups
{% endblock %}

{% block content %}
  <button hx-get="{% url 'schedule:group-create' %}"
          hx-target="#form-container"
          hx-swap="innerHTML">
    + Add new group
  </button>

  <div id="form-container"
       hx-get="{% url 'schedule:group-create' %}"
       hx-trigger="load"
       hx-swap="innerHTML">
  </div>

  <table>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Students count</th>
      <th>Delete group</th>
    </tr>
    {% for group in groups %}
    <tr>
      <td><a href="{% url 'schedule:group-students' pk=group.id %}">{{ group.id }}</a></td>
      <td><a href="#"
             hx-get="{% url 'schedule:group-update' pk=group.id %}"
             hx-target="#form-container"
             hx-swap="innerHTML"
      >{{ group.name }}</a></td>
      <td>{{ group.active_students_count }}</td>
      <td><a href="#"
             hx-post="{% url 'schedule:group-delete' pk=group.pk %}"
             hx-confirm="Are you sure you want to delete this group?"
      >Delete</a></td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
