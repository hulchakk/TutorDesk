<h1>Update student {{ student.name }}</h1>

<form method="post" action="{% url 'schedule:student-update' pk=student.pk%}">
  {% csrf_token %}
  <label>
    Student name:
    {{ form.name }}
  </label>
  <label>
    Price per lesson:
    {{ form.lessons_price }}
  </label>
  <input type="submit" value="Save">
</form>
