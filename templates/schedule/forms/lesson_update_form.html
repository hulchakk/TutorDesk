<form hx-post="{% url 'schedule:lesson-update' pk=lesson.id %}"
      hx-target="this"
      hx-swap="outerHTML">

<h1>Edit lesson</h1>

  {% if form.non_field_errors %}
    <div class="form-error">
      {{ form.non_field_errors }}
    </div>
  {% endif %}

  <label>
    Start date and time:
    {{ form.start_datetime }}
    {% if form.start_datetime.errors %}
      <span class="field-error">{{ form.start_datetime.errors }}</span>
    {% endif %}
  </label>

  <label>
    Duration (minutes):
    {{ form.duration }}
    {% if form.duration.errors %}
      <span class="field-error">{{ form.duration.errors }}</span>
    {% endif %}
  </label>

  <label>
    Student:
    {{ form.student }}
    {% if form.student.errors %}
      <span class="field-error">{{ form.student.errors }}</span>
    {% endif %}
  </label>

  <label>
    Status:
    {{ form.status }}
    {% if form.status.errors %}
      <span class="field-error">{{ form.status.errors }}</span>
    {% endif %}
  </label>

  <button type="submit">Save changes</button>
</form>

<form hx-post="{% url 'schedule:lesson-delete' pk=lesson.id %}"
      hx-confirm="Are you sure you want to delete this lesson?">
  <button type="submit">Delete</button>
</form>
