<h1>Edit lesson</h1>

<form method="post" action="{% url 'schedule:lesson-update' pk=lesson.id %}">
  {% csrf_token %}
  <label>
    Start date and time:
    {{ form.start_datetime }}
  </label>
  <label>
    Duration (minutes):
    {{ form.duration }}
  </label>
  <label>
    Student:
    {{ form.student }}
  </label>
  <label>
    Status:
    {{ form.status }}
  </label>
  <input type="submit" value="Save changes">
</form>
<form method="post" action="{% url 'schedule:lesson-delete' pk=lesson.id %}">
  {% csrf_token %}
  <input type="submit" value="Delete">
</form>
