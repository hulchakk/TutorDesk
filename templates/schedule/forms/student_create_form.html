<form hx-post="{% url 'schedule:student-create' %}"
      hx-target="this"
      hx-swap="outerHTML">

  <h1>Create student</h1>

  {% if form.non_field_errors %}
    <div class="form-error">
      {{ form.non_field_errors }}
    </div>
  {% endif %}

  <label>
    Student name:
    {{ form.name }}
    {% if form.name.errors %}
      <span class="field-error">{{ form.name.errors }}</span>
    {% endif %}
  </label>

  <label>
    Available Tariffs:
    {{ form.available_tariffs }}
    {% if form.available_tariffs.errors %}
      <span class="field-error">{{ form.available_tariffs.errors }}</span>
    {% endif %}
  </label>

  <button type="submit">Create</button>
</form>
