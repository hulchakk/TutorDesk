<h1>Create group lesson</h1>

<form method="post" action="{% url 'schedule:group-lesson-create' %}">
  {% csrf_token %}
  <label>
    Start date and time:
    {{ form.start_datetime }}
  </label>
  <label>
    Duration (minutes):
    {{ form.duration }}
  </label>
  <label>
    Group:
    {{ form.group }}
  </label>
  <label>
    Status:
    {{ form.status }}
  </label>
  <input type="submit" value="Create lesson">
</form>
