<form hx-post="{% url 'schedule:group-create' %}"
      hx-target="this"
      hx-swap="outerHTML">

<h1>Create group</h1>

  {% if form.non_field_errors %}
    <div class="form-error">
      {{ form.non_field_errors }}
    </div>
  {% endif %}

  <label>
    Group name:
    {{ form.name }}
    {% if form.name.errors %}
      <span class="field-error">{{ form.name.errors }}</span>
    {% endif %}
  </label>

  <button type="submit">Create</button>
</form>
