{% extends 'base.html' %}

{% block title %}
	My - students
{% endblock %}

{% block content %}
  <table>
    <tr>
      <th>Name</th>
      <th>Lessons left</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.name }}</td>
      <td>{{ student.lessons_count }}</td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
