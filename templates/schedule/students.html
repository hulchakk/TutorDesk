{% extends 'base.html' %}

{% block title %}
	My - students
{% endblock %}

{% block content %}
  <form method="post" action="{% url 'schedule:students' %}">
    {% csrf_token %}
    <label>
      Student name:
      {{ form.name }}
    </label>
    <label>
      Price per lesson:
      {{ form.lessons_price }}
    </label>
    <input type="submit" value="Create">
  </form>
  <table>
    <tr>
      <th>Name</th>
      <th>Lessons left</th>
      <th>Lessons price</th>
      <th>Delete student</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.name }}</td>
      <td>{{ student.lessons_count }}</td>
      <td>{{ student.lessons_price }}</td>
      <td><a href="{% url "schedule:student-delete" pk=student.pk %}">Delete</a></td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
