{% extends 'base.html' %}

{% block title %}
	My - students
{% endblock %}

{% block content %}
  <button hx-get="{% url 'schedule:student-create' %}"
          hx-target="#form-container"
          hx-swap="innerHTML">
    + Add new group
  </button>

  <div id="form-container"
       hx-get="{% url 'schedule:student-create' %}"
       hx-trigger="load"
       hx-swap="innerHTML">
  </div>

  <table>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Lessons left</th>
      <th>Delete student</th>
    </tr>
    {% for student in students %}
    <tr>
      <td>{{ student.id }}</td>
      <td><a href="#"
             hx-get="{% url 'schedule:student-update' student.id %}"
             hx-target="#form-container"
             hx-swap="innerHTML"
      >{{ student.name }}</a></td>
      <td>{{ student.total_lessons_count }}</td>
      <td><a href="#"
             hx-post="{% url 'schedule:student-delete' pk=student.pk %}"
             hx-confirm="Are you sure you want to delete this student?"
      >Delete</a></td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
