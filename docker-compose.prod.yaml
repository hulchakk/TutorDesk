x-app: &app
  build: .
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: tutor_app.settings.prod
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    <<: *app
    command: sh -c "python manage.py wait_for_db && python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn tutor_app.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"

  celery:
    <<: *app
    command: celery -A tutor_app worker -l info

  celery-beat:
    <<: *app
    command: celery -A tutor_app beat -l info

volumes:
  postgres_data:
